<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><style>.u{font-family:Segoe UI,Arial}.s{font-size:13px}.t{font-size:11px}.b{font-weight:700}</style></defs><rect width="1440" height="900" fill="#f4f7fb"/><rect width="224" height="900" fill="#102742"/><text x="25" y="45" class="u b" fill="white" font-size="16">⌁ Northstar Support</text><text x="258" y="39" class="u s" fill="#68788e">Support workspace / Platform case notes</text><text x="258" y="111" class="u t b" fill="#1769aa" letter-spacing="1">LINUX + AWS LEARNING</text><text x="258" y="150" class="u" font-size="28" fill="#172b4d" font-weight="700">Triage by evidence, escalate by ownership</text><text x="258" y="178" class="u s" fill="#68788e">Two fictional cases show platform-aware checks and careful access boundaries.</text><rect x="258" y="207" width="558" height="565" rx="9" fill="white" stroke="#e4eaf1"/><rect x="258" y="207" width="558" height="8" rx="4" fill="#83a957"/><text x="284" y="250" class="u t b" fill="#55718d">NS-1088 · UBUNTU</text><text x="284" y="287" class="u" font-size="20" fill="#172b4d" font-weight="700">Cannot resolve internal host</text><text x="284" y="316" class="u s" fill="#68788e">Reported: IP access works, hostname fails.</text><text x="284" y="359" class="u t b" fill="#74869a" letter-spacing="1">READ-ONLY CHECKS</text><rect x="284" y="376" width="505" height="118" rx="7" fill="#10243b"/><text x="302" y="404" class="u t" fill="#e3edf7" font-family="Consolas,monospace">ip address</text><text x="302" y="430" class="u t" fill="#e3edf7" font-family="Consolas,monospace">resolvectl status</text><text x="302" y="456" class="u t" fill="#e3edf7" font-family="Consolas,monospace">getent hosts intranet.example.invalid</text><text x="284" y="528" class="u t b" fill="#74869a" letter-spacing="1">SAFE TRIAGE</text><text x="284" y="563" class="u s" fill="#172b4d">1  Confirm exact host, error and scope.</text><text x="284" y="598" class="u s" fill="#172b4d">2  Separate DNS resolution from reachability.</text><text x="284" y="633" class="u s" fill="#172b4d">3  Compare with an approved known-good device.</text><rect x="284" y="672" width="505" height="70" rx="7" fill="#f7f9fc" stroke="#e4eaf1"/><text x="300" y="697" class="u t b" fill="#172b4d">Handoff</text><text x="300" y="720" class="u t" fill="#68788e">DNS, VPN or DHCP changes → network administrator.</text><rect x="836" y="207" width="570" height="565" rx="9" fill="white" stroke="#e4eaf1"/><rect x="836" y="207" width="570" height="8" rx="4" fill="#e39a3d"/><text x="862" y="250" class="u t b" fill="#55718d">NS-1120 · AWS TABLETOP</text><text x="862" y="287" class="u" font-size="20" fill="#172b4d" font-weight="700">Analyst receives AccessDenied</text><text x="862" y="316" class="u s" fill="#68788e">Hypothetical S3 request · no account connected.</text><text x="862" y="359" class="u t b" fill="#74869a" letter-spacing="1">INVESTIGATION QUESTIONS</text><rect x="862" y="376" width="518" height="153" rx="7" fill="#f7f9fc" stroke="#e4eaf1"/><text x="881" y="405" class="u s b" fill="#172b4d">Confirm the access context</text><text x="881" y="432" class="u t" fill="#68788e">Which account and role did approved sign-in use?</text><text x="881" y="458" class="u t" fill="#68788e">Which exact action/resource failed, and when?</text><text x="881" y="484" class="u t" fill="#68788e">Is the request approved and in scope?</text><text x="881" y="510" class="u t" fill="#68788e">Who owns policy review?</text><text x="862" y="565" class="u t b" fill="#74869a" letter-spacing="1">LEAST-PRIVILEGE HANDOFF</text><rect x="862" y="582" width="518" height="94" rx="7" fill="#10243b"/><text x="881" y="611" class="u t" fill="#e3edf7" font-family="Consolas,monospace">aws sts get-caller-identity</text><text x="881" y="638" class="u t" fill="#91a8be" font-family="Consolas,monospace"># Authorized training account only</text><text x="881" y="660" class="u t" fill="#91a8be" font-family="Consolas,monospace"># No credentials in this demo</text><rect x="862" y="697" width="518" height="45" rx="7" fill="#fff8e9" stroke="#f0dfb8"/><text x="878" y="716" class="u t b" fill="#654c13">AccessDenied does not name the blocking policy.</text><text x="878" y="733" class="u t" fill="#765817">Ask the account owner; do not apply broad grants.</text><text x="700" y="832" class="u t" fill="#8a98a8">Illustrative previews · fictional cases · no production host</text></svg>
