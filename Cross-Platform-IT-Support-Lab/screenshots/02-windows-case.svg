<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><style>.u{font-family:Segoe UI,Arial}.s{font-size:13px}.t{font-size:11px}.b{font-weight:700}</style></defs><rect width="1440" height="900" fill="#f4f7fb"/><rect width="224" height="900" fill="#102742"/><text x="25" y="45" class="u b" fill="white" font-size="16">⌁ Northstar Support</text><text x="258" y="39" class="u s" fill="#68788e">Support workspace / Windows case</text><text x="258" y="112" class="u t b" fill="#1769aa" letter-spacing="1">WINDOWS · CASE NS-1042</text><text x="258" y="151" class="u" font-size="28" fill="#172b4d" font-weight="700">Laptop reports low disk space</text><text x="258" y="181" class="u s" fill="#68788e">Practice user · Finance · Simulated ticket</text><rect x="258" y="208" width="1148" height="52" rx="8" fill="#fff8e9" stroke="#f0dfb8"/><text x="276" y="231" class="u s b" fill="#654c13">Training example only</text><text x="276" y="249" class="u t" fill="#765817">No device was queried and no storage was cleaned up for this scenario.</text><rect x="258" y="282" width="715" height="250" rx="9" fill="white" stroke="#e4eaf1"/><text x="282" y="316" class="u s b" fill="#172b4d">Reported issue &amp; scope</text><line x1="258" y1="334" x2="973" y2="334" stroke="#e4eaf1"/><text x="282" y="366" class="u t b" fill="#5b6e84">User statement</text><text x="405" y="366" class="u s" fill="#172b4d">“Storage is low and my spreadsheet will not save.”</text><text x="282" y="405" class="u t b" fill="#5b6e84">Symptom</text><text x="405" y="405" class="u s" fill="#172b4d">Free-space warning; save failures reported.</text><text x="282" y="444" class="u t b" fill="#5b6e84">Scope</text><text x="405" y="444" class="u s" fill="#172b4d">One fictional Windows 11 laptop; impact unverified.</text><text x="282" y="483" class="u t b" fill="#5b6e84">Priority</text><rect x="405" y="467" width="55" height="23" rx="11" fill="#fdeeee"/><text x="415" y="483" class="u t b" fill="#ad4242">High</text><rect x="990" y="282" width="416" height="250" rx="9" fill="white" stroke="#e4eaf1"/><text x="1014" y="316" class="u s b" fill="#172b4d">Read-only evidence examples</text><line x1="990" y1="334" x2="1406" y2="334" stroke="#e4eaf1"/><rect x="1014" y="353" width="368" height="94" rx="7" fill="#10243b"/><text x="1031" y="382" class="u t" fill="#e3edf7" font-family="Consolas,monospace">Get-PSDrive -PSProvider FileSystem</text><text x="1031" y="408" class="u t" fill="#e3edf7" font-family="Consolas,monospace">Get-Volume | Select DriveLetter,</text><text x="1031" y="428" class="u t" fill="#e3edf7" font-family="Consolas,monospace">Size,SizeRemaining</text><text x="1014" y="479" class="u t" fill="#68788e">Review before running. Redact identifiers.</text><rect x="258" y="552" width="1148" height="249" rx="9" fill="white" stroke="#e4eaf1"/><text x="282" y="587" class="u s b" fill="#172b4d">Triage and safe handoff</text><line x1="258" y1="605" x2="1406" y2="605" stroke="#e4eaf1"/><text x="282" y="642" class="u s" fill="#172b4d">1  Clarify &nbsp;&nbsp; Ask exact error, affected apps and whether work may be lost.</text><text x="282" y="685" class="u s" fill="#172b4d">2  Verify &nbsp;&nbsp;&nbsp; Check free space; keep personal files private.</text><text x="282" y="728" class="u s" fill="#172b4d">3  Escalate &nbsp; Get approval and follow backup policy before cleanup.</text><rect x="282" y="753" width="1097" height="28" rx="5" fill="#f0f7fc"/><text x="295" y="772" class="u t b" fill="#1769aa">Conclusion: possible capacity issue; verify actual free space before remediation.</text><text x="700" y="858" class="u t" fill="#8a98a8">Illustrative preview · fictional training record</text></svg>
